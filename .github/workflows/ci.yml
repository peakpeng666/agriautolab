name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 默认 token 只读；workflow 中没有任何写仓库的步骤。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install "ruff==0.16.4"
      - name: Ruff
        run: ruff check .

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # 几何语义绑定 Shapely 2.1.2；测试工具也固定，避免 CI 自身漂移。
      - name: Install package and test tools
        run: >-
          python -m pip install -e .
          "shapely==2.1.2"
          "pytest==9.1.1"
          "ruff==0.16.4"
      - name: Dependency consistency
        run: python -m pip check
      - name: Package metadata
        run: python -c "import importlib.metadata as m; assert m.version('agriautolab') == '0.5.1.dev0'"
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Pytest
        run: python -m pytest -q
