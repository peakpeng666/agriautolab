name: D1 evidence preview

on:
  pull_request:
    paths:
      - "src/agriautolab/selection/**"
      - "scripts/prepare_cv_folds.py"
      - "tests/selection/**"
      - "evidence/v7/manifest.json"
      - "evidence/v7/holdout_seal.json"

jobs:
  generate-cv-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e .
      - name: Generate D1 assignment
        run: |
          python scripts/prepare_cv_folds.py \
            --manifest evidence/v7/manifest.json \
            --holdout evidence/v7/holdout_seal.json \
            --output /tmp/cv_assignment.json \
            --print-json
