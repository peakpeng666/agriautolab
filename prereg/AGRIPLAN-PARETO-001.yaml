# AGRIPLAN-PARETO-001 预注册
# Block B 的可证伪承诺：假设、检验、样本量、显著性、多重比较校正、失败判据，
# 全部在看到结果之前写死。封存方式见文末；封存脚本 scripts/seal_preregistration.py。

study_id: AGRIPLAN-PARETO-001
registered_before_analysis: true
base_commit: 见 scripts/seal_preregistration.py 输出的 seal 记录（仓库首次提交之后追加）

design:
  claim: 偏好条件下的 Pareto 推荐——给定地块 + 机具 + 偏好向量，
    在精确 Pareto 前沿上定位应采用的配置，并刻画哪些特征决定前沿形状
  pool: 12 个基线算法的五阶段组合体（algorithms/catalog.py，pool_hash 随证据记录）
  objectives: [path_length, headland_turn_count, row_crossings]   # 全部最小化
  excluded_diagnostic: transit_length   # 与 path_length 秩相关 rho=1.000，240 实例实测
  reference_point: 协议声明的解析上界（pareto.hypervolume.analytic_reference），进协议哈希
  oracle: 45 ms/实例的穷举预算使每个实例都有精确前沿真值，无近似标签

hypotheses:
  H1:
    statement: Pareto 前沿大小中位数 > 1（目标间存在真实权衡，策略非嵌套支配）
    test: 对每个实例取 |pareto_front(pool)|，报告中位数与 IQR 的符号检验（Wilcoxon 符号秩，
      对 1.0 的单侧）+ 前沿大小 == 1 的实例占比
    sample_size: 240 实例（沿用 §0.1 的实例生成协议）
    alpha: 0.01
    failure: 中位数 == 1，或 > 90% 实例的前沿大小为 1（单配置全能即无推荐可言）
  H2:
    statement: row_angle_vs_principal 与前沿大小正相关（顺行-顺形状冲突越大，可选越多）
    test: Spearman 秩相关（特征 vs |front|），240 对
    alpha: 0.01
    failure: rho <= 0，或 |rho| < 0.1 且方向不定
  H3:
    statement: 偏好条件推荐器在留出集上的超体积损失 < 随机选配置的一半
    test: 留出集上 mean(HV(推荐配置) / HV(前沿)) 对比 mean(HV(随机配置) / HV(前沿))，
      双侧配对置换检验（10^4 次置换，种子写死）
    alpha: 0.01
    failure: 推荐器损失 >= 随机损失的一半，或推荐器不可行率高于随机基线
    note: 推荐器本体属于 Block C（依赖未安装），本假设随 Block B 的特征与前沿基建一起预注册

multiple_comparison:
  correction: Holm-Bonferroni（三条假设族，按 p 值升序逐步比较 alpha/(m-k+1)）
  family: [H1, H2, H3]

holdout:
  fraction: 0.3（240 实例中 72 个）
  sealing: HoldoutVault（evidence/holdout.py）——封存记录只含 problem_id 列表、
    种子与内容哈希，不含时钟；重复封存被拒绝。这是纪律不是安全：封存要的是
    「实验开始后留出集没有被动过」的可审计主张，不是防得住人的锁
  seed: 20260821

replication:
  determinism: 一切随机走注入的 numpy.random.Generator；演化账本逐位可复现
    （tests/agent/test_agent.py::test_evolution_with_mock_proposer_is_bitwise_reproducible）
  frozen_baselines: Dubins 解析真值、BCD cell 数、超体积解析真值、特征不变性
    （tests/analytic、tests/stages、tests/pareto、tests/features）
